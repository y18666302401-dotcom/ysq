<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画风样张</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;900&family=Noto+Serif+SC:wght@700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1E6D2;--fg:#2A1F33;--muted:#6D5F70;--line:#D3C3A8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17121C;--fg:#F1E6D2;--muted:#A897A8;--line:#3A2F42;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17121C;--fg:#F1E6D2;--muted:#A897A8;--line:#3A2F42;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC","PingFang SC",system-ui,sans-serif}
main{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}
.stage,.bar,.note{width:min(calc(78vh * 9 / 16),calc(100vw - 32px),460px)}
.stage{aspect-ratio:9/16;border-radius:18px;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.bar{display:flex;flex-wrap:wrap;gap:6px}
.bar button{font:inherit;font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.note{margin:0;font-size:13px;line-height:1.7;color:var(--muted)}
</style>
</head>
<body>
<main>
<div class="stage"><canvas id="cv" role="img" aria-label="同一场景的多种画风样张：老学者和橘猫在 19 世纪的书房里"></canvas></div>
<div class="bar" id="bar"></div>
<p class="note">同一个场景（3/4 侧身的老学者向橘猫讲解，背景是书房、相机和一组猫下落的连续照片）用九种画风出图。造型共用一套 3D 截面数据，画风只决定描边、填色、阴影、纸纹和后期。点上面的按钮切换，画面持续播放。</p>
</main>
<svg width="0" height="0" style="position:absolute">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
  <filter id="wc"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="8" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="14"/></filter>
  <filter id="ink"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="9"/></filter>
</svg>
<script src="../../skills/documentary-video/scripts/character_kit.js"></script>
<script src="../three-quarter/kit3q.js"></script>
<script>
const W=1080,H=1920,FPS=24,DUR=8;
const cv=document.getElementById('cv');cv.width=W;cv.height=H;
const MAIN=cv.getContext('2d');let ctx=MAIN;
const {blob,tube,trace}=CharKit;
const {camera,rotY,rotX,surf,surfNormal,sliceAt,sliceAtZ,ringY,ringZ,hull,sweepPolys,silhouette,ik3,follow,brush,lerp,clamp}=K3;
const O='#2A1F33';
const C={coat:'#3F5E8C',coatD:'#2E4870',coatSh:'#B9BCD6',pants:'#3A3346',pantsD:'#2B2536',pantsSh:'#CFC6DA',skin:'#F6C7A0',skinD:'#E9AE88',skinSh:'#EDB9A2',
  beard:'#DCD8D0',beardD:'#BDB7AE',beardSh:'#CCC4C2',shoe:'#1E1825',shirt:'#F4EEE2',brass:'#E7B54A',cheek:'rgba(232,120,110,.28)',
  fur:'#F39A3B',furD:'#D9772C',furSh:'#DDAA92',stripe:'#C25E1E',belly:'#FFE9C9',pink:'#F48FA0',eye:'#F7E27A',white:'#FFFFFF'};
const ss=(a,b,x)=>{const k=clamp((x-a)/(b-a));return k*k*(3-2*k)};
const blinkAt=(t,list)=>list.reduce((m,b)=>Math.max(m,1-Math.abs(t-b)/.09),0);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rgb=h=>{if(h[0]!=='#')return null;const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const toHex=a=>'#'+a.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');
const mix=(a,b,k)=>{const A=rgb(a),B=rgb(b);return A&&B?toHex(A.map((v,i)=>lerp(v,B[i],k))):a};
const lum=h=>{const a=rgb(h);return a?(a[0]*.3+a[1]*.59+a[2]*.11)/255:.5};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};

// ---------- 纹理（固定种子，生成一次） ----------
function noiseTex(seed,size,{base='#F3EADA',dark=.10,fibers=0,grain=.06,lowFreq=.08}={}){
  const c=mk(size,size),g=c.getContext('2d'),r=mulberry32(seed);g.fillStyle=base;g.fillRect(0,0,size,size);
  const img=g.getImageData(0,0,size,size),d=img.data,G=16,grid=[];for(let i=0;i<(G+1)*(G+1);i++)grid.push(r());
  const vn=(x,y)=>{const gx=x/size*G,gy=y/size*G,i=Math.floor(gx),j=Math.floor(gy),fx=gx-i,fy=gy-j,s=k=>k*k*(3-2*k),a=grid[j*(G+1)+i],b=grid[j*(G+1)+i+1],c2=grid[(j+1)*(G+1)+i],e=grid[(j+1)*(G+1)+i+1];return lerp(lerp(a,b,s(fx)),lerp(c2,e,s(fx)),s(fy))};
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){const k=(y*size+x)*4,v=1-lowFreq*vn(x,y)-grain*r();d[k]*=v;d[k+1]*=v;d[k+2]*=v}
  g.putImageData(img,0,0);
  g.strokeStyle=`rgba(90,70,50,${dark})`;g.lineWidth=1;for(let i=0;i<fibers;i++){const x=r()*size,y=r()*size,a=r()*6.28,l=6+r()*22;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a)*l*.5+r()*4,y+Math.sin(a)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
  return c;
}
let TEX=null;
function textures(){if(TEX)return TEX;
  const hatch=(col,sp,w)=>{const c=mk(sp,sp),g=c.getContext('2d');g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(-1,sp+1);g.lineTo(sp+1,-1);g.moveTo(-1,1);g.lineTo(1,-1);g.moveTo(sp-1,sp+1);g.lineTo(sp+1,sp-1);g.stroke();return MAIN.createPattern(c,'repeat')};
  const dots=(col,sp,r)=>{const c=mk(sp,sp),g=c.getContext('2d');g.fillStyle=col;g.beginPath();g.arc(sp/2,sp/2,r,0,7);g.fill();g.beginPath();[[0,0],[sp,0],[0,sp],[sp,sp]].forEach(([x,y])=>g.arc(x,y,r*.0,0,7));g.fill();return MAIN.createPattern(c,'repeat')};
  TEX={paper:noiseTex(11,512,{fibers:260,grain:.07,lowFreq:.10}),rice:noiseTex(5,512,{base:'#F2ECDD',fibers:900,dark:.07,grain:.05,lowFreq:.14}),
    wcpaper:noiseTex(7,512,{base:'#FBF6EC',fibers:60,grain:.09,lowFreq:.16}),kraft:noiseTex(3,512,{base:'#E7DCC6',fibers:500,dark:.09,grain:.08,lowFreq:.12}),
    grain:noiseTex(9,256,{base:'#808080',grain:.5,lowFreq:0}),
    hatch:hatch('rgba(27,21,17,.75)',9,1.6),dotsK:dots('rgba(20,16,30,.85)',10,2.6),dotsS:dots('rgba(20,16,30,.55)',14,2.2)};
  return TEX;}
function overlay(tex,mode,alpha=1){MAIN.save();MAIN.setTransform(1,0,0,1,0,0);MAIN.globalCompositeOperation=mode;MAIN.globalAlpha=alpha;const p=MAIN.createPattern(tex,'repeat');MAIN.fillStyle=p;MAIN.fillRect(0,0,W,H);MAIN.restore()}
function vignette(a=.45){const g=MAIN.createRadialGradient(W/2,H*.48,H*.25,W/2,H*.5,H*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(10,6,16,${a})`);MAIN.save();MAIN.setTransform(1,0,0,1,0,0);MAIN.fillStyle=g;MAIN.fillRect(0,0,W,H);MAIN.restore()}

// ---------- 画风：只改出图方式，造型不变 ----------
let STYLE=null,FRAME=0;
function fig(layers,S){
  const st=STYLE;
  const L=layers.map(l=>({...l,after:st.noDetail?null:l.after,parts:l.parts.map((p,i)=>{
    const pts=st.jitter?CharKit.jitter(p.pts,st.jitter,FRAME*7+i+p.pts.length):p.pts;
    const fill=st.fillMap?st.fillMap(p.fill):p.fill;
    let shade=p.shade;if(shade!==false){if(st.shade==='dark')shade=mix(fill,st.darkTo||'#1A1030',st.darkK||.22);else if(st.shade!==undefined)shade=st.shade;else if(shade&&st.shadeMap)shade=st.shadeMap(shade)}
    return {...p,pts,fill,shade,detail:st.noDetail?null:p.detail,rim:st.rim||p.rim};
  })}));
  const opts={...S,light:st.light||[.55,.85],shadeMode:st.shadeMode||'multiply',rimDepth:st.rimDepth||5};
  if(st.line!==undefined)opts.line=st.line;if(st.lw)opts.lw=st.lw;if(st.weight!==undefined)opts.weight=st.weight;
  ctx.save();if(st.layerFilter)ctx.filter=st.layerFilter;if(st.layerComp)ctx.globalCompositeOperation=st.layerComp;
  if(st.layerShadow){ctx.shadowColor=st.layerShadow[0];ctx.shadowBlur=st.layerShadow[1];ctx.shadowOffsetX=st.layerShadow[2];ctx.shadowOffsetY=st.layerShadow[3]}
  CharKit.figure(ctx,L,opts);ctx.restore();
}
</script>
<script src="chars.js"></script>
<script>
// ---------- 书房背景：也用 fig() 画，自动跟着画风走 ----------
// 墙、护墙板、地板、左上的窗（主光从这里来）、墙上一组"猫下落"的连续照片、右边三脚架上的木箱相机
const R=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
const BG={wall:'#E8CFA0',wallD:'#D9B987',wains:'#9C5C38',wainsD:'#7E4527',floor:'#B9774A',floorD:'#985C36',wood:'#7A4A2A',woodD:'#5C3520',sky:'#BFD9E6',skyD:'#9CC0D3',photo:'#EFE6D0',brass:'#E7B54A',lens:'#3D4A63'};
function room(t){
  const S={line:O,lw:5,weight:2};
  fig([{parts:[{pts:R(-20,-20,W+40,1220),fill:BG.wall,shade:false,detail:g=>{g.fillStyle=BG.wallD;for(let x=60;x<W;x+=150)g.fillRect(x,0,46,1200)}}]}],{...S,line:null});
  fig([{parts:[{pts:R(-20,1180,W+40,280),fill:BG.wains,shade:false,detail:g=>{g.fillStyle=BG.wainsD;for(let x=30;x<W;x+=260)g.fillRect(x,1220,200,190)}}]},
       {parts:[{pts:R(-20,1440,W+40,520),fill:BG.floor,shade:false,detail:g=>{g.fillStyle=BG.floorD;for(let y=1500;y<H;y+=90)g.fillRect(0,y,W,8);for(let i=0;i<14;i++){const y=1440+Math.floor(i/2)*90,x=(i%2?260:720)+((i*137)%200);g.fillRect(x,y,8,90)}}}]}],S);
  // 窗：夜里也透着天光，窗框是木头
  fig([{parts:[{pts:R(90,250,320,500),fill:BG.wood,shade:false},{pts:R(116,276,268,448),fill:BG.sky,shade:false,detail:g=>{g.fillStyle=BG.skyD;g.fillRect(116,560,268,164);g.fillStyle='rgba(255,255,255,.5)';g.beginPath();g.moveTo(150,276);g.lineTo(230,276);g.lineTo(140,450);g.lineTo(116,450);g.fill()}}],
    after:g=>{g.fillStyle=BG.wood;g.fillRect(242,276,16,448);g.fillRect(116,492,268,16)}}],S);
  // 墙上的连续照片：四格猫在空中翻身（故事里的"翻正反射"）
  fig([{parts:[{pts:R(540,330,440,220),fill:BG.wood,shade:false},{pts:R(560,350,400,180),fill:BG.photo,shade:false,detail:g=>{
      for(let i=0;i<4;i++){const x=610+i*100,y=440,a=Math.PI*(1-i/3);g.fillStyle='#5B4A3E';g.save();g.translate(x,y);g.rotate(a);g.beginPath();g.ellipse(0,0,34,14,0,0,7);g.fill();g.beginPath();g.arc(30,-8,12,0,7);g.fill();g.fillRect(-20,8,6,16);g.fillRect(14,8,6,16);g.restore()}
      g.fillStyle='rgba(91,74,62,.6)';for(let i=1;i<4;i++)g.fillRect(560+i*100,350,3,180)}}]}],S);
  // 三脚架上的木箱相机
  const tri=[[900,1010],[828,1450],[900,1470],[972,1450]];
  fig([{parts:[tube([[896,1010],[828,1452]],[[0,9],[1,7]]),tube([[904,1010],[972,1452]],[[0,9],[1,7]]),tube([[900,1010],[900,1470]],[[0,9],[1,7]])].map(p=>({pts:p,fill:BG.wood,shade:BG.woodD}))},
    {parts:[{pts:blob([[820,890],[980,890],[990,900],[990,1010],[980,1020],[820,1020],[810,1010],[810,900]],4),fill:BG.wood,shade:'#C9A487',detail:g=>{g.fillStyle=BG.woodD;g.fillRect(810,950,180,10)}},
      {pts:tube([[810,955],[740,955]],[[0,40],[1,46]],{cap1:'flat'}),fill:'#2F2A3D',shade:false},{pts:blob([[740,905],[728,908],[722,955],[728,1002],[740,1005],[746,955]],4),fill:BG.brass,shade:'#D9B98A'}],
     after:g=>{g.fillStyle=BG.lens;g.beginPath();g.ellipse(734,955,8,34,0,0,7);g.fill();g.fillStyle='rgba(255,255,255,.6)';g.beginPath();g.ellipse(732,940,3,9,0,0,7);g.fill()}}],S);
  // 地上的影子
  ctx.save();ctx.fillStyle='rgba(40,20,10,.18)';ctx.beginPath();ctx.ellipse(400,1652,230,30,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(740,1792,280,30,0,0,7);ctx.fill();ctx.restore();
}
function actors(t,k=1,ox=0,oy=0){
  scholar(camera({yaw:32,pitch:8,s:1.3*k,ox:ox+380*k,oy:oy+1650*k}),t,{lw:STYLE.lw||6});
  cat(camera({yaw:38,pitch:12,s:1.15*k,ox:ox+740*k,oy:oy+1790*k}),t);
}
function tag(text,{font='900 46px "Noto Sans SC"',fg='#FFF6E8',bg='rgba(28,20,36,.82)',x=48,y=60}={}){
  MAIN.save();MAIN.setTransform(1,0,0,1,0,0);MAIN.font=font;const w=MAIN.measureText(text).width;
  MAIN.fillStyle=bg;MAIN.beginPath();MAIN.roundRect(x,y,w+56,84,42);MAIN.fill();MAIN.fillStyle=fg;MAIN.textBaseline='middle';MAIN.fillText(text,x+28,y+44);MAIN.restore()}

// ---------- 九种画风 ----------
const STYLES={
  cartoon:{label:'① 描边卡通',bg:room,post(){overlay(textures().grain,'overlay',.10)}},
  flat:{label:'② 扁平插画',line:null,shade:'dark',shadeMode:'source-over',weight:0,bg:room,post(){overlay(textures().grain,'multiply',.25);overlay(textures().paper,'multiply',.35)}},
  hand:{label:'③ 逐帧手绘',line:'#1B1511',lw:5,weight:3,jitter:2.4,shadeMode:'multiply',get shade(){return textures().hatch},
    bg:room,post(){overlay(textures().paper,'multiply',.9);vignette(.25)}},
  watercolor:{label:'④ 水彩绘本',line:'rgba(70,45,55,.55)',lw:2.2,weight:1,fillMap:f=>mix(f,'#FFFFFF',.12),layerFilter:'url(#wc)',
    bg(t){MAIN.drawImage(textures().wcpaper,0,0,W,H);room(t)},post(){overlay(textures().wcpaper,'multiply',.55);overlay(textures().grain,'soft-light',.35)}},
  ink:{label:'⑤ 水墨',line:'#141210',lw:7,weight:6,shade:'dark',darkTo:'#000000',darkK:.18,shadeMode:'source-over',
    fillMap:f=>{const l=rgb(f)?lum(f):.6;return mix('#F4EFE4','#1A1816',Math.pow(1-l,1.2)*.85)},layerFilter:'url(#ink) grayscale(1)',
    bg(t){MAIN.drawImage(textures().rice,0,0,W,H);inkBg(t)},post(){overlay(textures().rice,'multiply',.6);seal()}},
  comic:{label:'⑥ 美漫网点',line:'#0E0A12',lw:8,weight:6,fillMap:f=>{const a=rgb(f);if(!a)return f;const m=(a[0]+a[1]+a[2])/3;return toHex(a.map(v=>m+(v-m)*1.35))},get shade(){return textures().dotsK},
    bg(t){comicBg(t)},post(t){bubble('喵？',860,1150);MAIN.save();MAIN.lineWidth=18;MAIN.strokeStyle='#0E0A12';MAIN.strokeRect(9,9,W-18,H-18);MAIN.restore()}},
  silhouette:{label:'⑦ 光影剪影',line:null,fillMap:()=> '#140D22',shade:false,noDetail:true,globalRim:'#FFC27A',
    bg(t){sunset(t)},post(){vignette(.55);overlay(textures().grain,'overlay',.12)}},
  papercut:{label:'⑧ 剪纸拼贴',line:null,shade:'dark',darkK:.18,shadeMode:'source-over',weight:0,layerShadow:['rgba(40,20,10,.38)',16,4,9],layerFilter:'url(#rough)',
    bg:room,post(){overlay(textures().kraft,'multiply',.55)}},
  pixel:{label:'⑨ 像素',pixel:true,lw:9,weight:4,bg:room,post(){}}
};
// 水墨：远山淡墨、近处一块石头，留白
function inkBg(t){
  const g=MAIN;g.save();g.filter='url(#ink)';
  [[700,'rgba(30,28,26,.10)',260,.004],[860,'rgba(30,28,26,.18)',200,.006],[1060,'rgba(30,28,26,.28)',150,.009]].forEach(([y0,c,amp,f],i)=>{
    g.fillStyle=c;g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=12)g.lineTo(x,y0-amp*Math.pow(Math.abs(Math.sin(x*f+i*1.7)),1.6)-40*Math.sin(x*.02+i));g.lineTo(W,H);g.fill()});
  g.fillStyle='rgba(20,18,16,.08)';g.fillRect(0,1500,W,420);
  g.restore();
  g.save();g.fillStyle='#141210';g.font='900 64px "Noto Serif SC"';g.textAlign='center';['猫','何','以','落','地'].forEach((ch,i)=>g.fillText(ch,980,330+i*76));g.restore();
}
function seal(){const g=MAIN;g.save();g.setTransform(1,0,0,1,0,0);g.fillStyle='#B8322A';g.globalAlpha=.9;g.fillRect(944,720,72,72);g.fillStyle='#F4EFE4';g.font='900 30px "Noto Serif SC"';g.textAlign='center';g.textBaseline='middle';g.fillText('翻正',980,756);g.restore()}
// 美漫：放射速度线 + 网点渐变
function comicBg(t){
  const g=MAIN;g.fillStyle='#F6D44E';g.fillRect(0,0,W,H);
  g.save();g.translate(760,1300);const r=mulberry32(3);for(let i=0;i<90;i++){const a=i/90*Math.PI*2+r()*.03,w=.012+r()*.02;g.fillStyle=i%2?'#F9E486':'#F0B83A';g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a)*2400,Math.sin(a)*2400);g.lineTo(Math.cos(a+w)*2400,Math.sin(a+w)*2400);g.fill()}g.restore();
  g.save();g.fillStyle=textures().dotsS;g.globalAlpha=.6;g.fillRect(0,1440,W,480);g.restore();
  g.fillStyle='#E65A3A';g.fillRect(0,1440,W,10);
}
function bubble(text,x,y){const g=MAIN;g.save();g.setTransform(1,0,0,1,0,0);g.fillStyle='#FFFFFF';g.strokeStyle='#0E0A12';g.lineWidth=8;g.beginPath();g.ellipse(x,y,130,82,0,0,7);g.moveTo(x-50,y+60);g.lineTo(x-100,y+170);g.lineTo(x-4,y+76);g.fill();g.stroke();
  g.fillStyle='#FFFFFF';g.beginPath();g.ellipse(x,y,124,76,0,0,7);g.fill();g.fillStyle='#0E0A12';g.font='900 66px "ZCOOL KuaiLe","Noto Sans SC"';g.textAlign='center';g.textBaseline='middle';g.fillText(text,x,y+4);g.restore()}
// 光影剪影：黄昏天空、太阳在右后方、远山层层、漂浮光点
function sunset(t){
  const g=MAIN,sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#1B1840');sky.addColorStop(.42,'#5A3A72');sky.addColorStop(.7,'#E0786A');sky.addColorStop(.84,'#FFC78A');sky.addColorStop(1,'#3A2240');g.fillStyle=sky;g.fillRect(0,0,W,H);
  g.save();g.globalCompositeOperation='lighter';const sg=g.createRadialGradient(880,1600,0,880,1600,640);sg.addColorStop(0,'rgba(255,236,190,1)');sg.addColorStop(.12,'rgba(255,200,130,.75)');sg.addColorStop(.45,'rgba(240,120,90,.22)');sg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=sg;g.fillRect(0,0,W,H);g.restore();
  [['#7A4A6E',1650,70,.006],['#4E2F55',1720,50,.009],['#2E1C3A',1780,30,.014]].forEach(([c,y0,amp,f],i)=>{g.fillStyle=c;g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=10)g.lineTo(x,y0-amp*(Math.sin(x*f+i)+.6*Math.sin(x*f*2.3+i*2)));g.lineTo(W,H);g.fill()});
  g.fillStyle='#140D22';g.fillRect(0,1800,W,200);
  const r=mulberry32(5);g.save();g.globalCompositeOperation='lighter';for(let i=0;i<60;i++){const x=r()*W,y=300+r()*1200,s=1+r()*3,ph=r()*6;g.fillStyle=`rgba(255,220,170,${.25+.35*Math.sin(t*1.3+ph)**2})`;g.beginPath();g.arc(x+Math.sin(t*.4+ph)*12,y-t*6,s,0,7);g.fill()}g.restore();
}
// 像素：在 216×384 的小画布上画（不同画风共用造型），再量化到有限的调色板、整数倍放大
const OFF=mk(W,H).getContext('2d'),RIM=mk(W,H),LOW=mk(216,384),LCTX=LOW.getContext('2d',{willReadFrequently:true});
let PALETTE=null;
function quantize(){
  if(!PALETTE)PALETTE=[...new Set([O,...Object.values(C),...Object.values(BG),'#1B1511','#FFFFFF','#E8CFA0'].filter(c=>c[0]==='#'))].map(rgb);
  const img=LCTX.getImageData(0,0,216,384),d=img.data;
  for(let i=0;i<d.length;i+=4){let best=0,bd=1e9;for(let k=0;k<PALETTE.length;k++){const p=PALETTE[k],e=(d[i]-p[0])**2*.3+(d[i+1]-p[1])**2*.59+(d[i+2]-p[2])**2*.11;if(e<bd){bd=e;best=k}}const p=PALETTE[best];d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];d[i+3]=255}
  LCTX.putImageData(img,0,0);
}

function render(t,key){
  STYLE=STYLES[key||CUR];FRAME=Math.floor(t*12);
  const st=Math.floor(t*12)/12;
  MAIN.setTransform(1,0,0,1,0,0);MAIN.filter='none';MAIN.globalCompositeOperation='source-over';MAIN.clearRect(0,0,W,H);
  if(STYLE.pixel){
    // 先按原尺寸画（线条加粗），再缩小到 1/5、量化到调色板、整数倍放大
    ctx=OFF;OFF.setTransform(1,0,0,1,0,0);OFF.clearRect(0,0,W,H);room(st);actors(st);ctx=MAIN;
    LCTX.imageSmoothingEnabled=true;LCTX.imageSmoothingQuality='high';LCTX.clearRect(0,0,216,384);LCTX.drawImage(OFF.canvas,0,0,216,384);quantize();
    MAIN.imageSmoothingEnabled=false;MAIN.drawImage(LOW,0,0,W,H);MAIN.imageSmoothingEnabled=true;
  }else{
    ctx=MAIN;STYLE.bg(st);
    if(STYLE.globalRim){ // 剪影：先合成整个角色，再按整体轮廓算一道朝向光源（右侧）的轮廓光
      ctx=OFF;OFF.setTransform(1,0,0,1,0,0);OFF.clearRect(0,0,W,H);actors(st);ctx=MAIN;MAIN.drawImage(OFF.canvas,0,0);
      const T=RIM.getContext('2d');T.globalCompositeOperation='source-over';T.clearRect(0,0,W,H);T.drawImage(OFF.canvas,0,0);
      T.globalCompositeOperation='source-in';T.fillStyle=STYLE.globalRim;T.fillRect(0,0,W,H);
      T.globalCompositeOperation='destination-out';T.drawImage(OFF.canvas,-5,2);
      MAIN.save();MAIN.globalCompositeOperation='lighter';MAIN.filter='blur(6px)';MAIN.globalAlpha=.7;MAIN.drawImage(RIM,0,0);MAIN.filter='none';MAIN.globalAlpha=1;MAIN.drawImage(RIM,0,0);MAIN.restore();
    }else actors(st);
    STYLE.post(st);
  }
  tag(STYLE.label);
}
let CUR='cartoon';
window.VIDEO={W,H,FPS,DUR};window.STYLES=STYLES;
window.setStyle=k=>{CUR=k;document.querySelectorAll('#bar button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k))};
window.renderFrame=n=>render(n/FPS);
const bar=document.getElementById('bar');Object.entries(STYLES).forEach(([k,s])=>{const b=document.createElement('button');b.textContent=s.label;b.dataset.k=k;b.setAttribute('aria-pressed',k===CUR);b.onclick=()=>setStyle(k);bar.appendChild(b)});
let t0=null;function loop(ts){if(t0===null)t0=ts;render(((ts-t0)/1000)%DUR);requestAnimationFrame(loop)}
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{if(!navigator.webdriver)requestAnimationFrame(loop);else render(0)});
</script>
