<!doctype html>

<style>

.stage,.controls,.note{width:min(calc(80vh * 9 / 16),calc(100vw - 32px),460px)}
.stage{aspect-ratio:9/16;border-radius:20px;overflow:hidden;background:#000}

<body>
<main>
<div class="stage"><canvas id="cv" role="img" aria-label="竖版动画样片：天空为什么是蓝的"></canvas></div>

<input id="seek" type="range" min="0" max="15" step="0.01" value="0" aria-label="时间轴">

</div>
<p class="note">15 秒样片，全部画面由 JavaScript + Canvas 绘制。每一帧都由 render(t) 按时间计算，可以直接接入逐帧导出流程。按空格键播放或暂停。</p>
</main>
<script>
const W=1080,H=1920,FPS=30,DUR=15;
const cv=document.getElementById('cv');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{const k=clamp((x-a)/(b-a));return k*k*(3-2*k)};
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eout=k=>1-Math.pow(1-k,4);
const hex=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const mix=(a,b,k)=>{const A=hex(a),B=hex(b);return`rgb(${Math.round(lerp(A[0],B[0],k))},${Math.round(lerp(A[1],B[1],k))},${Math.round(lerp(A[2],B[2],k))})`};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function glow(r,rgb){const c=mk(r*2,r*2),g=c.getContext('2d'),gr=g.createRadialGradient(r,r,0,r,r,r);gr.addColorStop(0,`rgba(${rgb},1)`);gr.addColorStop(.22,`rgba(${rgb},.5)`);gr.addColorStop(.55,`rgba(${rgb},.12)`);gr.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=gr;g.fillRect(0,0,r*2,r*2);return c}
const G_WARM=glow(160,'255,212,150'),G_BLUE=glow(64,'120,186,255'),G_WHITE=glow(64,'255,248,236');

function cloud(seed,c0,c1){const w=700,h=300,c=mk(w,h),g=c.getContext('2d'),r=mulberry32(seed);g.filter='blur(16px)';
for(let i=0;i<34;i++){const u=r(),x=w*(.12+.76*u),y=h*(.62-.32*Math.sin(u*Math.PI)*r()),rad=h*(.14+.2*r());
const gr=g.createRadialGradient(x,y-rad*.25,0,x,y,rad);gr.addColorStop(0,c0);gr.addColorStop(.6,c1);gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,rad,0,Math.PI*2);g.fill()}return c}
const CL_D=[1,2,3,4].map(s=>cloud(s*11,'rgba(255,228,214,.42)','rgba(226,150,150,.16)'));
const CL_C=[1,2,3,4].map(s=>cloud(s*17,'rgba(255,255,255,.85)','rgba(212,228,250,.35)'));

const VIG=(()=>{const c=mk(W,H),g=c.getContext('2d'),gr=g.createRadialGradient(540,880,380,540,960,1300);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.5)');g.fillStyle=gr;g.fillRect(0,0,W,H);return c})();
const NOISE=(()=>{const c=mk(256,256),g=c.getContext('2d'),d=g.createImageData(256,256),r=mulberry32(99);for(let i=0;i<d.data.length;i+=4){const v=Math.floor(r()*255);d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);return c})();
const PAT=ctx.createPattern(NOISE,'repeat');

const R=mulberry32(7);
const RAY=Array.from({length:16},()=>[R(),R()]);
const STARS=Array.from({length:90},()=>({x:R()*W,y:R()*820,s:.8+R()*1.6,ph:R()*6}));
const DUST=Array.from({length:70},()=>({x:R()*W,y:700+R()*800,v:8+R()*22,s:2+R()*4,ph:R()*6}));
const BOKEH=Array.from({length:12},()=>({x:R()*W,y:R()*H,r:120+R()*220,a:.07+R()*.12,warm:R()<.3,ph:R()*6}));
const SPARK=Array.from({length:170},()=>({x:R()*W,y:120+R()*1180,s:10+R()*20,ph:R()*6}));
const RAYC=Array.from({length:9},()=>[80+R()*920,240+R()*820]);

const MTN=[{b:1230,a:[70,38,18],f:[.0021,.0057,.013],p:[.3,1.7,2.9],v:6},{b:1320,a:[90,40,20],f:[.0017,.0049,.011],p:[2.1,.4,1.2],v:12},{b:1430,a:[110,46,22],f:[.0014,.0041,.0105],p:[4,2.2,.7],v:22},{b:1560,a:[120,52,24],f:[.0012,.0036,.009],p:[1,3.3,5.1],v:36}];
const ridge=(L,x)=>L.b-(L.a[0]*Math.sin(x*L.f[0]+L.p[0])+L.a[1]*Math.sin(x*L.f[1]+L.p[1])+L.a[2]*Math.sin(x*L.f[2]+L.p[2]));
const DAWN={cols:[['#8C8DB3','#6E6F98'],['#62668F','#4A4D78'],['#3D4170','#2C2F58'],['#1F2244','#141632']],rim:'rgb(255,205,165)',mist:'255,206,178'};
const DAY={cols:[['#A9C3E3','#8FAED6'],['#7D9CCB','#6687BA'],['#557BAE','#456A9C'],['#30507E','#253F66']],rim:'rgb(255,255,255)',mist:'235,244,255'};

const B=(()=>{const x0=1250,y0=150,x1=-250,y1=1450,dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;return{x0,y0,len,ux,uy,nx:-uy,ny:ux,ang:Math.atan2(dy,dx)}})();
const MOL=[];{const r=mulberry32(21);let i=0;while(MOL.length<14&&i<400){i++;const u=.1+.8*r(),off=(r()-.5)*300,x=B.x0+B.ux*u*B.len+B.nx*off,y=B.y0+B.uy*u*B.len+B.ny*off;if(x<70||x>1010||y<460||y>1220)continue;if(MOL.some(m=>Math.hypot(m.x-x,m.y-y)<120))continue;MOL.push({x,y,u,off,r:17+r()*9,rot:r()*6,sp:r()<.5?-1:1,ph:r()*6})}}
const LBL=MOL.reduce((best,m,i)=>Math.hypot(m.x-560,m.y-860)<Math.hypot(MOL[best].x-560,MOL[best].y-860)?i:best,0);
const BLUE=[];{const r=mulberry32(33);const inBeam=MOL.map((m,i)=>i).filter(i=>Math.abs(MOL[i].off)<150);const N=84;for(let i=0;i<N;i++){const m=inBeam[Math.floor(r()*inBeam.length)],M=MOL[m],D=M.u*B.len+M.off*0,t0=5.3+(i/N)*4.1+r()*.05;BLUE.push({m,t0,ta:t0+D/1600,sx:M.x-B.ux*D,sy:M.y-B.uy*D,th:r()*Math.PI*2,v:520+r()*320})}}
const WARM=[];{const r=mulberry32(44);for(let i=0;i<36;i++){const off=(r()-.5)*240;WARM.push({t0:5.2+i*(4.4/36),sx:B.x0+B.nx*off-B.ux*100,sy:B.y0+B.ny*off-B.uy*100})}}

const EYE=[347,1470];
const CAPS=[[0.9,4.4,'每天抬头看到的蓝天，其实是一场光的游戏。'],[5.5,7.6,'阳光看起来是白色，其实混着各种颜色。'],[7.7,9.9,'穿过大气时，蓝光最容易被空气分子撞散。'],[10.5,12.7,'被撞散的蓝光，从四面八方涌进眼睛。'],[12.9,14.6,'所以，整片天空看起来都是蓝的。']];
const SERIF='"Noto Serif SC","Songti SC","SimSun",serif',SANS='"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif';

function mountains(t,P,ga){MTN.forEach((L,i)=>{const off=t*L.v,pts=[];for(let x=-60;x<=W+60;x+=12)pts.push([x,ridge(L,x+off)]);
ctx.beginPath();ctx.moveTo(-60,H+60);pts.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineTo(W+60,H+60);ctx.closePath();
const gr=ctx.createLinearGradient(0,L.b-200,0,L.b+500);gr.addColorStop(0,P.cols[i][0]);gr.addColorStop(1,P.cols[i][1]);ctx.fillStyle=gr;ga(1);ctx.fill();
if(i<3){ctx.strokeStyle=P.rim;ctx.lineWidth=2.5;ga(.45-i*.12);ctx.beginPath();pts.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
const mg=ctx.createLinearGradient(0,L.b-30,0,L.b+170);mg.addColorStop(0,`rgba(${P.mist},0)`);mg.addColorStop(.5,`rgba(${P.mist},.26)`);mg.addColorStop(1,`rgba(${P.mist},0)`);ctx.fillStyle=mg;ga(1);ctx.fillRect(-60,L.b-30,W+120,200)}})}

function sceneA(t,al){const ga=v=>ctx.globalAlpha=clamp(al*v),p=clamp(t/5);
const sx=640,sy=lerp(1300,1080,eout(p)),z=1+.05*p+.9*eio(ss(4.2,5.4,t));
ctx.save();ctx.translate(sx,sy);ctx.scale(z,z);ctx.translate(-sx,-sy);
const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,mix('#0B1029','#1B2752',p));g.addColorStop(.36,mix('#232C5C','#3E5390',p));g.addColorStop(.55,mix('#7A5A86','#C98A8C',p));g.addColorStop(.64,mix('#D48F7C','#FFB98E',p));g.addColorStop(.75,mix('#E9B08C','#FFD9AE',p));g.addColorStop(1,'#F3CFA6');
ctx.fillStyle=g;ga(1);ctx.fillRect(0,0,W,H);
ctx.fillStyle='#FFFFFF';STARS.forEach(s=>{ga((1-p)*(.45+.45*Math.sin(t*2+s.ph)));ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,Math.PI*2);ctx.fill()});
ctx.globalCompositeOperation='lighter';ga(.45+.4*p);ctx.drawImage(G_WARM,sx-760,sy-760,1520,1520);
const rg=ctx.createRadialGradient(sx,sy,30,sx,sy,1800);rg.addColorStop(0,'rgba(255,226,180,1)');rg.addColorStop(.45,'rgba(255,214,170,.3)');rg.addColorStop(1,'rgba(255,214,170,0)');ctx.fillStyle=rg;
RAY.forEach((r,i)=>{const a=-Math.PI/2+(r[0]-.5)*2.6+Math.sin(t*.35+i)*.03,w=.02+.035*r[1];ga((.035+.05*r[1])*(.4+.6*p));ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+Math.cos(a-w)*1900,sy+Math.sin(a-w)*1900);ctx.lineTo(sx+Math.cos(a+w)*1900,sy+Math.sin(a+w)*1900);ctx.closePath();ctx.fill()});
ctx.globalCompositeOperation='source-over';ga(1);ctx.fillStyle='#FFF3D9';ctx.beginPath();ctx.arc(sx,sy,62,0,Math.PI*2);ctx.fill();
ctx.globalCompositeOperation='lighter';ga(.9);ctx.drawImage(G_WHITE,sx-180,sy-180,360,360);ctx.globalCompositeOperation='source-over';
[{s:0,x:-80,y:560,c:1.15,v:16},{s:1,x:520,y:700,c:.95,v:24},{s:2,x:-260,y:860,c:1.35,v:34},{s:3,x:640,y:930,c:.85,v:20},{s:1,x:180,y:1010,c:.7,v:28}].forEach(c=>{ga(.9);ctx.drawImage(CL_D[c.s],c.x+t*c.v,c.y,700*c.c,300*c.c)});
mountains(t,DAWN,ga);
ctx.globalCompositeOperation='lighter';DUST.forEach(d=>{const x=(d.x+t*d.v)%W,y=d.y+Math.sin(t*.8+d.ph)*14,a=clamp(1-Math.hypot(x-sx,y-sy)/900)*.8;if(a<=0)return;ga(a);ctx.drawImage(G_WHITE,x-d.s*3,y-d.s*3,d.s*6,d.s*6)});
ctx.restore();
title(t,al*(1-ss(3.9,4.5,t)))}

function title(t,al){if(al<=0)return;ctx.save();ctx.textBaseline='alphabetic';
ctx.font=`700 104px ${SERIF}`;const s=[...'天空为什么是蓝的？'],ws=s.map(c=>ctx.measureText(c).width),tot=ws.reduce((a,b)=>a+b,0)+(s.length-1)*6;let x=(W-tot)/2;
ctx.shadowColor='rgba(18,10,40,.45)';ctx.shadowBlur=30;ctx.fillStyle='#FFF7EC';
s.forEach((c,i)=>{const k=eout(clamp((t-.5-i*.08)/.8));ctx.globalAlpha=al*k;ctx.fillText(c,x,440+(1-k)*36);x+=ws[i]+6});
ctx.shadowBlur=0;const lw=160*eout(clamp((t-1.3)/.9));ctx.globalAlpha=al*.8;ctx.fillStyle='rgba(255,236,214,1)';ctx.fillRect(540-lw/2,476,lw,2);
ctx.shadowBlur=16;ctx.font=`500 38px ${SANS}`;const s2=[...'一次关于光的旅行'],w2=s2.map(c=>ctx.measureText(c).width),t2=w2.reduce((a,b)=>a+b,0)+(s2.length-1)*16;x=(W-t2)/2;
ctx.fillStyle='#FFEFE0';const k2=eout(clamp((t-1.6)/.8));ctx.globalAlpha=al*k2*.9;s2.forEach((c,i)=>{ctx.fillText(c,x,536+(1-k2)*14);x+=w2[i]+16});
ctx.restore()}

function molecule(x,y,r,rot,ga,a){ctx.globalCompositeOperation='lighter';ga(a*.3);ctx.drawImage(G_BLUE,x-r*3,y-r*3,r*6,r*6);ctx.globalCompositeOperation='source-over';
[-1,1].forEach(sd=>{const ax=x+Math.cos(rot)*r*.55*sd,ay=y+Math.sin(rot)*r*.55*sd,gr=ctx.createRadialGradient(ax-r*.35,ay-r*.35,r*.1,ax,ay,r);gr.addColorStop(0,'#F3F7FF');gr.addColorStop(.55,'#9EB6EA');gr.addColorStop(1,'#56709F');ctx.fillStyle=gr;ga(a);ctx.beginPath();ctx.arc(ax,ay,r,0,Math.PI*2);ctx.fill()})}

function sceneB(t,al){const ga=v=>ctx.globalAlpha=clamp(al*v);
ctx.save();const z=1+.4*(1-eout(ss(4.4,6.4,t)))+.03*ss(5,10,t);ctx.translate(540,800);ctx.scale(z,z);ctx.translate(-540,-800);
const bg=ctx.createRadialGradient(760,620,60,620,900,1500);bg.addColorStop(0,'#24407E');bg.addColorStop(.45,'#142553');bg.addColorStop(1,'#070D24');ctx.fillStyle=bg;ga(1);ctx.fillRect(-200,-200,W+400,H+400);
ctx.globalCompositeOperation='lighter';BOKEH.forEach(b=>{ga(b.a);const x=b.x+Math.sin(t*.25+b.ph)*40,y=b.y+Math.cos(t*.2+b.ph)*30;ctx.drawImage(b.warm?G_WARM:G_BLUE,x-b.r,y-b.r,b.r*2,b.r*2)});
const bi=ss(5,5.9,t);ctx.save();ctx.translate(B.x0,B.y0);ctx.rotate(B.ang);
let lg=ctx.createLinearGradient(0,-190,0,190);lg.addColorStop(0,'rgba(255,236,206,0)');lg.addColorStop(.5,'rgba(255,236,206,.2)');lg.addColorStop(1,'rgba(255,236,206,0)');ctx.fillStyle=lg;ga(bi);ctx.fillRect(0,-190,B.len*bi,380);
lg=ctx.createLinearGradient(0,-36,0,36);lg.addColorStop(0,'rgba(255,248,236,0)');lg.addColorStop(.5,'rgba(255,248,236,.32)');lg.addColorStop(1,'rgba(255,248,236,0)');ctx.fillStyle=lg;ctx.fillRect(0,-36,B.len*bi,72);ctx.restore();
ctx.globalCompositeOperation='source-over';
MOL.forEach((m,i)=>{const k=ss(5.3+i*.04,5.9+i*.04,t);if(k>0)molecule(m.x+Math.sin(t*3.1+m.ph)*3,m.y+Math.cos(t*2.7+m.ph)*3,m.r,m.rot+t*.4*m.sp,ga,k)});
ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
WARM.forEach(p=>{const s=(t-p.t0)*1600;if(s<0||s>B.len+300)return;const hx=p.sx+B.ux*s,hy=p.sy+B.uy*s,tx=hx-B.ux*110,ty=hy-B.uy*110,g=ctx.createLinearGradient(tx,ty,hx,hy);g.addColorStop(0,'rgba(255,200,107,0)');g.addColorStop(1,'rgba(255,206,120,.95)');ctx.strokeStyle=g;ctx.lineWidth=7;ga(1);ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(hx,hy);ctx.stroke();ga(.8);ctx.drawImage(G_WARM,hx-24,hy-24,48,48)});
BLUE.forEach(p=>{if(t<p.t0)return;const m=MOL[p.m],life=t-p.ta;if(life>1.7)return;
const pos=tt=>{if(tt<p.ta){const s=(tt-p.t0)*1600;return[p.sx+B.ux*s,p.sy+B.uy*s]}const d=(tt-p.ta)*p.v;return[m.x+Math.cos(p.th)*d,m.y+Math.sin(p.th)*d]};
const pre=t<p.ta,[hx,hy]=pos(t),[tx,ty]=pos(pre?t-.07:Math.max(p.ta,t-.09));if(Math.hypot(hx-tx,hy-ty)<1)return;
const col=pre?'244,247,255':'120,186,255',a=pre?1:clamp(1-life/1.7),g=ctx.createLinearGradient(tx,ty,hx,hy);g.addColorStop(0,`rgba(${col},0)`);g.addColorStop(1,`rgba(${col},.95)`);
ctx.strokeStyle=g;ctx.lineWidth=6;ga(a);ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(hx,hy);ctx.stroke();ga(a*.9);ctx.drawImage(pre?G_WHITE:G_BLUE,hx-20,hy-20,40,40);
if(life>=0&&life<.5){const k=life/.5;ctx.strokeStyle='rgb(156,203,255)';ctx.lineWidth=3;ga((1-k)*.8);ctx.beginPath();ctx.arc(m.x,m.y,m.r+8+60*eout(k),0,Math.PI*2);ctx.stroke()}});
ctx.globalCompositeOperation='source-over';
const lm=MOL[LBL],la=ss(6.1,6.6,t)*(1-ss(9.3,9.8,t));if(la>0){const flip=lm.x>620,dir=flip?-1:1,ex=lm.x+dir*150,ey=lm.y-120;
ctx.strokeStyle='rgba(220,232,255,.75)';ctx.lineWidth=2;ga(la);ctx.beginPath();ctx.moveTo(lm.x+dir*(lm.r+10),lm.y-lm.r);ctx.lineTo(lm.x+dir*110,ey);ctx.lineTo(ex,ey);ctx.stroke();
ctx.textAlign=flip?'right':'left';ctx.fillStyle='#F2F6FF';ctx.font=`500 40px ${SANS}`;ctx.fillText('空气分子',ex+dir*12,ey+14);ctx.fillStyle='rgba(214,226,255,.8)';ctx.font=`400 28px ${SANS}`;ctx.fillText('主要是氮气和氧气',ex+dir*12,ey+56);ctx.textAlign='left'}
ctx.restore();
const pa=ss(6.9,7.5,t)*al;if(pa>0){ctx.save();ctx.globalAlpha=pa;rr(70,212,850,214,32);ctx.fillStyle='rgba(8,16,44,.58)';ctx.fill();ctx.strokeStyle='rgba(160,200,255,.2)';ctx.lineWidth=1.5;ctx.stroke();

const playBtn=document.getElementById('play'),seek=document.getElementById('seek'),timeEl=document.getElementById('time');
