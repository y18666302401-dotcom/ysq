<title>猫为什么四脚着地</title>

<p class="note">15 秒 2D 动画片画风样片：平涂加描边、一层硬边阴影、一拍二（每秒 12 张画）、角色有表情和挤压拉伸、镜头不推拉，场景之间硬切。全部由 Canvas 按时间逐帧绘制。点播放键开始，有配乐和音效。按空格键播放或暂停。</p>

<script>
const W=1080,H=1920,FPS=24,DUR=15,DRAW=12;
const cv=document.getElementById('cv');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');

// ---------- 工具 ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eout=k=>1-Math.pow(1-k,3);
const ein=k=>k*k;
const back=k=>{const c=1.9;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)}; // 带过冲的缓出
const spring=(k,f=3,d=5)=>1-Math.exp(-d*k)*Math.cos(f*Math.PI*k); // 弹簧回稳

// ---------- 配色：平涂 + 一层硬边阴影 ----------
const O='#2A1F33';           // 描边
const C={
  fur:'#F39A3B',furSh:'#D2702A',stripe:'#C25E1E',belly:'#FFE9C9',bellySh:'#EFCB9C',pink:'#F48FA0',
  wall:'#F4DDB2',wallSh:'#E6C690',wains:'#B9734A',wainsSh:'#9C5C38',floor:'#C98552',floorSh:'#A86A3E',
  cloth:'#2F2A3D',clothA:'#3B3550',clothB:'#262131',
  coat:'#3F5E8C',coatSh:'#2E4870',pants:'#3A3346',skin:'#F6C7A0',skinSh:'#E2A27C',beard:'#D9D6CF',beardSh:'#B5B0A6',
  wood:'#8B5A33',woodSh:'#6E4425',brass:'#E7B54A',lens:'#3D4A63',
  cush:'#D9534F',cushSh:'#B23E3B',star:'#FFD95A',white:'#FFFFFF',cream:'#F6EAD3'
};
const LW=7;

// 填色 → 用同一路径裁剪画阴影 → 描边。阴影是硬边色块，不用渐变。
function shape(path,fill,shade,lw=LW){
  ctx.beginPath();path();ctx.fillStyle=fill;ctx.fill();
  if(shade){ctx.save();ctx.beginPath();path();ctx.clip();ctx.beginPath();shade();ctx.fillStyle=shade.color||'rgba(0,0,0,.18)';ctx.fill();ctx.restore()}
  if(lw){ctx.beginPath();path();ctx.lineWidth=lw;ctx.strokeStyle=O;ctx.lineJoin='round';ctx.stroke()}
}
function sh(color,fn){fn.color=color;return fn}
const ell=(x,y,rx,ry,r=0)=>()=>ctx.ellipse(x,y,rx,ry,r,0,Math.PI*2);
const circ=(x,y,r)=>()=>ctx.arc(x,y,r,0,Math.PI*2);
function rrect(x,y,w,h,r){return()=>{ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}}
function poly(pts){return()=>{pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath()}}
// 带描边的粗线（四肢、尾巴）：先画粗的描边色，再画细一圈的填充色
function limb(pts,w,fill,lw=LW){
  const path=()=>{ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);if(pts.length===3)ctx.quadraticCurveTo(pts[1][0],pts[1][1],pts[2][0],pts[2][1]);else pts.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]))};
  ctx.lineCap='round';ctx.lineJoin='round';
  path();ctx.strokeStyle=O;ctx.lineWidth=w+lw*2;ctx.stroke();
  path();ctx.strokeStyle=fill;ctx.lineWidth=w;ctx.stroke();
}
function line(pts,w=LW,col=O){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=w;ctx.strokeStyle=col;ctx.stroke()}

// ---------- 猫 ----------
// 身体是一整块：沿一条脊线（从臀到肩）生成一条连续的外轮廓，只填一次色、只描一次边，不分节。
// 翻正反射只体现在"身体内部"：前后半段各自的肚皮朝向（花纹和浅色肚皮在哪一侧）、腰部的弯折、腿和头的姿势。
//   view -1 肚皮朝上 → view 0 背朝镜头（只看到背上的条纹，腿缩成朝向镜头的短腿）→ view 1 四脚朝下
// o: {uf, ur: 前/后半段翻转进度 0..1；tf, tr: 腿收起 0..1；face; tail; blink}
const viewOf=u=>u<.34?-1:u<.67?0:1;
const LR=122,LF=112,NS=48;
function radius(s){const a=Math.abs(s),base=s<0?lerp(54,66,clamp(a/.5)):lerp(54,60,clamp(a/.5));return base*Math.sqrt(Math.max(0,1-Math.pow(a,3)))}
function spine(ar,af){ // 返回 s→{x,y,a} 的采样表；腰部附近弯折
  const ang=s=>s<0?ar*clamp(-s/.3):af*clamp(s/.3),pts={};
  let x=0,y=0;for(let i=0;i<=NS/2;i++){const s=i/(NS/2);pts[s.toFixed(4)]={x,y,a:ang(s)};const a=ang(s+1/NS);x+=Math.cos(a)*LF/(NS/2);y+=Math.sin(a)*LF/(NS/2)}
  x=0;y=0;for(let i=0;i<=NS/2;i++){const s=-i/(NS/2);pts[s.toFixed(4)]={x,y,a:ang(s)};const a=ang(s-1/NS);x-=Math.cos(a)*LR/(NS/2);y-=Math.sin(a)*LR/(NS/2)}
  const at=s=>{const q=Math.round(s*NS/2)/(NS/2);return pts[q.toFixed(4)]};
  return at;
}
const nrm=p=>[-Math.sin(p.a),Math.cos(p.a)];
function off(p,d){const n=nrm(p);return[p.x+n[0]*d,p.y+n[1]*d]}
function range(a,b){const r=[];for(let i=Math.round(a*NS/2);i<=Math.round(b*NS/2);i++)r.push(i/(NS/2));return r}
function band(at,s0,s1,d0,d1){ // 沿脊线、距中心 d0..d1（乘以半径，可以是随 s 变化的函数）的一条带状区域
  const ss=range(s0,s1),f=d=>typeof d==='function'?d:()=>d;const D0=f(d0),D1=f(d1);
  return()=>{ss.forEach((s,i)=>{const p=off(at(s),radius(s)*D0(s));i?ctx.lineTo(...p):ctx.moveTo(...p)});ss.slice().reverse().forEach(s=>ctx.lineTo(...off(at(s),radius(s)*D1(s))));ctx.closePath()}}
function bodyPath(at){return()=>{range(-1,1).forEach((s,i)=>{const p=off(at(s),-radius(s));i?ctx.lineTo(...p):ctx.moveTo(...p)});range(-1,1).reverse().forEach(s=>ctx.lineTo(...off(at(s),radius(s))));ctx.closePath()}}
function leg(pts,w,fill){ // 两段腿：肩/髋 → 膝 → 爪，膝盖是折角
  const path=()=>{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]))};
  ctx.lineCap='round';ctx.lineJoin='round';
  path();ctx.strokeStyle=O;ctx.lineWidth=w+LW*2;ctx.stroke();path();ctx.strokeStyle=fill;ctx.lineWidth=w;ctx.stroke();
  const p=pts[pts.length-1];shape(ell(p[0]+5,p[1]+2,w*.62,w*.42),fill,null,5);
}
function legPts(hy,tuck,front){
  return front
    ?[[0,hy],[lerp(8,40,tuck),lerp(hy+52,hy+30,tuck)],[lerp(4,6,tuck),lerp(hy+94,hy+46,tuck)]]
    :[[0,hy],[lerp(20,36,tuck),lerp(hy+50,hy+22,tuck)],[lerp(-4,-2,tuck),lerp(hy+92,hy+42,tuck)]];
}
// 在脊线上 s 处建立局部坐标（x 沿身体、+y 朝肚皮），v=-1 时上下翻转
function atFrame(at,s,v,fn){const p=at(s);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);if(v===-1)ctx.scale(1,-1);fn(radius(s));ctx.restore()}
function limbAt(at,s,v,tuck,front,fill){atFrame(at,s,v,r=>{if(v===0)leg([[0,r*.5],[2,r*.5+lerp(30,16,tuck)],[0,r*.5+lerp(56,30,tuck)]],28,fill);else leg(legPts(r*.45,tuck,front),front?30:32,fill)})}
function headBack(){
  shape(poly([[-46,-24],[-36,-90],[-6,-46]]),C.fur,null);shape(poly([[6,-46],[36,-90],[46,-24]]),C.fur,null);
  shape(ell(0,0,58,52),C.fur,sh(C.furSh,ell(0,46,64,22)));
  ctx.save();ctx.beginPath();ell(0,0,58,52)();ctx.clip();[-16,0,16].forEach(sx=>line([[sx,-54],[sx*.8,-26]],10,C.stripe));ctx.restore();
  ctx.beginPath();ell(0,0,58,52)();ctx.lineWidth=LW;ctx.strokeStyle=O;ctx.stroke();
}
function cat(x,y,k,o){
  const uf=o.uf||0,ur=o.ur||0,tf=o.tf||0,tr=o.tr||0;
  const vf=viewOf(uf),vr=viewOf(ur),vh=viewOf(clamp(uf*1.5));
  const at=spine(.3*Math.sin(Math.PI*ur),-.3*Math.sin(Math.PI*uf)); // 正在翻的那半段向外折，腰部成 V 字
  ctx.save();ctx.translate(x,y);ctx.scale(k*(o.sx||1),k*(o.sy||1));
  // 尾巴（在身体后面）
  atFrame(at,-.9,vr===0?1:vr,()=>{const a=o.tail||0;limb([[0,-14],[-66,-30+Math.sin(a)*55],[-78+Math.cos(a)*24,-110+Math.sin(a)*48]],24,C.fur)});
  // 远侧的腿
  limbAt(at,-.74,vr,tr,false,C.furSh);limbAt(at,.46,vf,tf,true,C.furSh);
  // 身体：一个连续的形状
  const body=bodyPath(at);
  ctx.beginPath();body();ctx.fillStyle=C.fur;ctx.fill();
  ctx.save();ctx.beginPath();body();ctx.clip();
  [[-1,0,vr,[-.7,-.42,-.16]],[0,1,vf,[.2,.48]]].forEach(([s0,s1,v,stripes])=>{
    const lo=Math.max(s0,-.99),hi=Math.min(s1,.99);
    if(v===0){ // 背朝镜头：脊背条纹在正中，两侧对称的短条纹
      ctx.beginPath();band(at,lo,hi,-.12,.12)();ctx.fillStyle=C.stripe;ctx.fill();
      stripes.forEach(s=>{line([off(at(s),-radius(s)*1.1),off(at(s+.04),-radius(s)*.35)],12,C.stripe);line([off(at(s),radius(s)*1.1),off(at(s+.04),radius(s)*.35)],12,C.stripe)});
      ctx.beginPath();band(at,lo,hi,.72,1.3)();ctx.fillStyle=C.furSh;ctx.fill();
    }else{ // 侧面：浅色肚皮在 v 那一侧，条纹在另一侧
      stripes.forEach(s=>line([off(at(s-.03),-v*radius(s)*1.1),off(at(s+.03),-v*radius(s)*.68),off(at(s),-v*radius(s)*.4)],12,C.stripe));
      // 前后半段朝向不同时，肚皮颜色在腰部逐渐收窄消失，不留方方正正的色块边
      const other=s0<0?vf:vr,taper=sv=>other===v?v*.3:v*lerp(1.05,.3,clamp(Math.abs(sv)/.3));
      ctx.beginPath();band(at,lo,hi,taper,v*1.3)();ctx.fillStyle=C.belly;ctx.fill();
      ctx.beginPath();band(at,lo,hi,.74,1.3)();ctx.fillStyle=v===1?C.bellySh:C.furSh;ctx.fill(); // 一层硬边阴影，永远在画面下侧
    }
  });
  ctx.restore();
  ctx.beginPath();body();ctx.lineWidth=LW;ctx.strokeStyle=O;ctx.lineJoin='round';ctx.stroke();
  // 近侧的腿
  limbAt(at,-.56,vr,tr,false,C.fur);limbAt(at,.62,vf,tf,true,C.fur);
  // 头：比身体先转过来
  atFrame(at,.9,1,r=>{ctx.translate(4,vh===1?-44:vh===-1?44:-16);if(vh===0)headBack();else{if(vh===-1)ctx.scale(1,-1);head(0,0,o)}});
  ctx.restore();
}
// 倒提时（view -1、腿伸直、身体不弯）两只近侧爪子在猫局部坐标里的位置，用来放马雷的手
function pawHold(s,front){const at=spine(0,0),p=at(s),r=radius(s),q=legPts(r*.45,0,front)[2];return[p.x+q[0],p.y-q[1]]}
const PAW_F=pawHold(.62,true),PAW_R=pawHold(-.56,false);
function head(x,y,o){
  ctx.save();ctx.translate(x,y);
  shape(poly([[-30,-36],[-20,-92],[12,-50]]),C.fur,sh(C.pink,poly([[-22,-44],[-18,-76],[2,-50]])));
  shape(poly([[20,-50],[50,-90],[56,-30]]),C.fur,sh(C.pink,poly([[28,-48],[47,-76],[50,-38]])));
  shape(ell(14,0,64,56),C.fur,sh(C.furSh,ell(30,46,70,26)));
  ctx.save();ctx.beginPath();ell(14,0,64,56)();ctx.clip();
  [[-8,-56],[10,-58]].forEach(([sx,sy])=>{ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+4,sy+20);ctx.lineWidth=10;ctx.strokeStyle=C.stripe;ctx.lineCap='round';ctx.stroke()});
  ctx.restore();
  ctx.beginPath();ell(14,0,64,56)();ctx.lineWidth=LW;ctx.strokeStyle=O;ctx.stroke();
  shape(ell(46,22,30,20),C.belly,null,5);
  ctx.fillStyle=C.pink;ctx.beginPath();ctx.moveTo(58,8);ctx.lineTo(72,8);ctx.lineTo(65,18);ctx.closePath();ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=O;ctx.stroke();
  [[78,14,108,6],[78,22,110,24],[24,18,-6,10],[24,26,-4,30]].forEach(w=>line([[w[0],w[1]],[w[2],w[3]]],3));
  const f=o.face||'normal',bl=o.blink;
  const eyes=[[18,-6],[56,-8]];
  if(f==='smug'||bl){eyes.forEach(([ex,ey])=>line(f==='smug'?[[ex-12,ey+4],[ex,ey-6],[ex+12,ey+4]]:[[ex-12,ey],[ex+12,ey]],6))}
  else if(f==='shock'){eyes.forEach(([ex,ey])=>{shape(circ(ex,ey-2,19),C.white,null,5);ctx.fillStyle=O;ctx.beginPath();ctx.arc(ex+2,ey-2,4.5,0,Math.PI*2);ctx.fill()});
    shape(ell(64,34,9,12),'#7A2E3A',null,4)}
  else{eyes.forEach(([ex,ey])=>{shape(ell(ex,ey,12,15),'#F7E27A',null,4);ctx.fillStyle=O;ctx.beginPath();ctx.ellipse(ex+2,ey,3.5,11,0,0,Math.PI*2);ctx.fill();
      if(f==='annoyed'){ctx.fillStyle=C.fur;ctx.fillRect(ex-16,ey-20,32,17);line([[ex-15,ey-3],[ex+15,ey-6]],5)}});
    if(f==='annoyed')line([[54,34],[70,32]],4)}
  if(f==='smug'){line([[52,32],[58,38],[64,32],[70,38],[76,32]],4)}
  if(f==='normal')line([[56,32],[64,36],[72,32]],4);
  ctx.restore();
}

// ---------- 马雷（1830–1904）：约 5 头身；秃顶，脑后一圈白发，白色络腮胡连着八字胡；深色长礼服 ----------
// 侧身朝右，伸手把猫举在身前。上身以髋部为轴微微后仰，用来平衡手里的重量。
function rot(p,c,a){const dx=p[0]-c[0],dy=p[1]-c[1];return[c[0]+dx*Math.cos(a)-dy*Math.sin(a),c[1]+dx*Math.sin(a)+dy*Math.cos(a)]}
function ik2(a,b,l1,l2,bend){ // 两段手臂的关节位置；bend=1 时肘部朝下
  const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.min(Math.hypot(dx,dy),l1+l2-1),ang=Math.atan2(dy,dx);
  const k=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));return[a[0]+Math.cos(ang+bend*k)*l1,a[1]+Math.sin(ang+bend*k)*l1];
}
function seg(a,b,w0,w1,fill){ // 一段两头粗细不同、带描边的肢体
  const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),nx=-Math.sin(ang),ny=Math.cos(ang);
  shape(()=>{ctx.moveTo(a[0]+nx*w0/2,a[1]+ny*w0/2);ctx.lineTo(b[0]+nx*w1/2,b[1]+ny*w1/2);ctx.arc(b[0],b[1],w1/2,ang+Math.PI/2,ang-Math.PI/2,true);ctx.lineTo(a[0]-nx*w0/2,a[1]-ny*w0/2);ctx.arc(a[0],a[1],w0/2,ang-Math.PI/2,ang+Math.PI/2,true);ctx.closePath()},fill,null);
}
function fist(p,ang,skin,shade){ // 握拳的手：手掌 + 压在上面的拇指
  ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(ang);
  shape(rrect(-16,-21,40,42,16),skin,sh(shade,rrect(-16,6,40,20,0)),5);
  [-8,3,14].forEach(x=>line([[x,10],[x,20]],3));
  shape(ell(6,-18,15,8,-.3),skin,null,4);
  ctx.restore();
}
function arm(sh0,hand,col,cuff,skin,shade){
  // 两只手臂保持同样的轻微弯曲
  const L=Math.hypot(hand[0]-sh0[0],hand[1]-sh0[1])*.54,el=ik2(sh0,hand,L,L,1),ang=Math.atan2(hand[1]-el[1],hand[0]-el[0]);
  const wr=[hand[0]-Math.cos(ang)*26,hand[1]-Math.sin(ang)*26];
  seg(sh0,el,50,44,col);seg(el,wr,44,40,col);
  ctx.beginPath();ctx.arc(el[0],el[1],21,0,Math.PI*2);ctx.fillStyle=col;ctx.fill(); // 盖住肘部接缝
  seg([wr[0]-Math.cos(ang)*4,wr[1]-Math.sin(ang)*4],[wr[0]+Math.cos(ang)*6,wr[1]+Math.sin(ang)*6],38,38,cuff);
  fist(hand,ang,skin,shade);
}
function marey(t,brow,hands,drawCat){
  const hip=[352,1300],lean=-.05,bob=Math.round(Math.sin(t*2.2)*3);
  const W2=p=>rot(p,hip,lean); // 上身（含头）后仰
  // 腿与鞋（不随上身后仰）
  seg([322,1290],[304,1530],56,44,C.pantsSh||'#2B2535');
  seg([378,1290],[394,1530],58,46,C.pants);
  shape(()=>{ctx.moveTo(274,1512);ctx.quadraticCurveTo(300,1500,336,1516);ctx.lineTo(344,1548);ctx.lineTo(270,1550);ctx.closePath()},'#1E1825',null,5);
  shape(()=>{ctx.moveTo(374,1510);ctx.quadraticCurveTo(420,1500,452,1530);ctx.quadraticCurveTo(458,1550,440,1552);ctx.lineTo(370,1552);ctx.closePath()},'#1E1825',null,5);

// ---------- 场景 2：下落特写（慢放） ----------
const T_DROP=4.3,T_LAND=9.3;
function catY(t){const p=prog(t,T_DROP+.1,T_LAND);return lerp(450,1060,.35*p+.65*p*p)} // 一开始就在动，越落越快
function shot2(t){
  ctx.fillStyle=C.cloth;ctx.fillRect(0,0,W,H);

  shape(ell(560,1250,330,70),C.cush,sh(C.cushSh,ell(560,1290,350,40)));

    ctx.fillStyle=C.white;ctx.font=`900 42px ${SANS}`;ctx.textAlign='center';ctx.fillText('慢 放',100,56);ctx.restore()}
  const y=catY(t),x=540;
  // 下落速度线
  if(t>T_DROP+.3&&t<T_LAND){const f=Math.floor(t*DRAW);for(let i=0;i<6;i++){const lx=380+((i*97+f*31)%330),ly=y-260-((i*53+f*40)%180);line([[lx,ly],[lx,ly-90-(i%3)*30]],6,'rgba(255,255,255,.55)')}}
  // 翻转进度：前半身 5.3–6.5，后半身 6.6–7.8
  const uf=eio(prog(t,5.3,6.5)),ur=eio(prog(t,6.6,7.8));
  const tf=t<5.2?0:t<8.1?1:1-eout(prog(t,8.1,8.6)),tr=t<6.5?0:t<8.1?1:1-eout(prog(t,8.1,8.6));
  // 落地挤压
  let sx=1,sy=1,shake=0;
  if(t>=T_LAND){const k=prog(t,T_LAND,T_LAND+.8),s=1-spring(k,2.5,6);sy=1-.28*s;sx=1+.2*s;shake=t<T_LAND+.25?((Math.floor(t*DRAW)%2)?10:-10):0}
  if(t>=T_LAND)ctx.translate(shake,0);

  ctx.restore();

    ctx.beginPath();ctx.moveTo(84,-30);ctx.lineTo(112,-6);ctx.lineTo(74,4);ctx.fillStyle=C.white;ctx.fill();ctx.restore()}});

    shape(rrect(-16,-110,32,80,14),C.star,null,6);shape(circ(0,-4,16),C.star,null,6);ctx.restore()}

  // 马雷的双手：先握住两只爪子，松手时手指张开、整只手迅速抽出画面

// ---------- 字幕：白字粗描边，重点词按信息类型标色 ----------
const SANS='"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif',DISPLAY='"ZCOOL KuaiLe","Noto Sans SC",sans-serif';
const AMBER='#F2B43C',RED='#FF6A4D';
const CAPS=[
  [0.4,3.9,[[['1894年',AMBER],['，法国生理学家马雷']],[['拍下了一只正在下落的猫。']]]],
  [4.5,6.6,[[['它先把'],['前半身',RED],['转过来，']]]],
  [6.7,8.4,[[['再让'],['后半身',RED],['跟上，']]]],
  [8.5,10.9,[[['落地前，'],['四只脚',RED],['已经朝下。']]]],
  [11.6,14.7,[[['这叫猫的'],['翻正反射',RED],['。']]]]
];
function caption(t){for(const[a,b,lines]of CAPS){if(t<a||t>b)continue;
  const k=back(prog(t,a,a+.25));ctx.save();ctx.font=`900 58px ${SANS}`;ctx.textBaseline='middle';ctx.lineJoin='round';
  lines.forEach((segs,li)=>{const w=segs.reduce((s,[x])=>s+ctx.measureText(x).width,0);let x=(W-w)/2;const y=1400+li*82-(lines.length-1)*41+(1-k)*20;
    segs.forEach(([s,c])=>{ctx.lineWidth=16;ctx.strokeStyle=O;ctx.strokeText(s,x,y);ctx.fillStyle=c||C.white;ctx.fillText(s,x,y);x+=ctx.measureText(s).width})});
  ctx.restore()}}

function render(t){
  t=clamp(t,0,DUR-1e-6);
  const tq=Math.floor(t*DRAW)/DRAW; // 一拍二：每秒 12 张画，每张停两帧
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  if(tq<4)shot1(tq);else if(tq<11)shot2(tq);else shot3(tq);
  ctx.setTransform(1,0,0,1,0,0);
  caption(tq);
  // 片头片尾黑场
  const fd=prog(t,0,.3)*(1-prog(t,DUR-.4,DUR));if(fd<1){ctx.globalAlpha=1-fd;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
}
window.renderFrame=fr=>render(fr/FPS);window.VIDEO={W,H,FPS,DUR};

let playing=false,cur=0,last=null;
function setPlaying(v){playing=v;last=null;playBtn.innerHTML=v?I_PAUSE:I_PLAY;playBtn.setAttribute('aria-label',v?'暂停':'播放');
  if(v){try{audio.currentTime=cur;const p=audio.play();if(p)p.catch(()=>{})}catch(e){}}else audio.pause()}
function ui(){seek.value=cur;timeEl.textContent=`${cur.toFixed(1)} / ${DUR.toFixed(1)} 秒`}
playBtn.addEventListener('click',()=>setPlaying(!playing));
seek.addEventListener('input',()=>{cur=+seek.value;try{audio.currentTime=cur}catch(e){}render(cur);ui()});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();setPlaying(!playing)}});
function loop(ts){if(playing){
    if(!audio.paused&&audio.readyState>=2){cur=audio.currentTime;if(audio.ended||cur>=DUR-.02){cur=0;audio.currentTime=0;audio.play().catch(()=>{})}}
    else if(last!==null)cur=(cur+(ts-last)/1000)%DUR;
    last=ts;render(Math.min(cur,DUR-1e-3));ui()}requestAnimationFrame(loop)}
setPlaying(false);cur=6;render(cur);ui();
const txt='1894年，法国生理学家马雷拍下了一只正在下落的猫。它先把前半身转过来，再让后半身跟上，落地前四只脚已经朝下。这叫猫的翻正反射艾蒂安-朱尔·马雷1830–1904慢放资料连续摄影';
